[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-orchestration-platform"
version = "0.1.0"
description = "Batch data pipeline orchestration: DAGs, scheduling, retries, SLA monitoring, quality gates, lineage, alerting."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
service = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
